<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SmartUploader - Изображения</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/reset.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<main class="images-page">


    <section class="upload__intro">

        <h1 id="images-title">Загруженные изображения</h1>

        <p id="images-description">
            Просмотр и управление всеми загруженными изображениями
        </p>

    </section>

    <!-- TABS -->
    <nav class="upload__tabs">

        <button id="upload-tab-btn" type="button" class="upload__tab">
            Загрузка
        </button>

        <button id="images-tab-btn" type="button" class="upload__tab upload__tab--active">
            Изображения
        </button>

    </nav>


    <section class="images__container">

        {% if images %}

            <div class="file-list-container">

                <div class="file-list-header">

                    <div>Превью</div>
                    <div>Имя</div>
                    <div>Действия</div>

                </div>

                <div id="file-list">

                    {% for image in images %}

                        <div class="file-list-item">

                            <!-- PREVIEW -->
                            <div>
                                <img
                                    src="{{ image.url }}"
                                    alt="{{ image.name }}"
                                    class="file-preview-image"
                                >
                            </div>


                            <div>
                                {{ image.name }}
                            </div>


                            <div>

                                <input
                                    type="text"
                                    value="{{ image.full_url }}"
                                    readonly
                                >


                                <button
                                    type="button"
                                    class="copy-btn"
                                    data-url="{{ image.full_url }}"
                                >
                                    КОПИРОВАТЬ
                                </button>


                                <form
                                    action="{{ url_for('delete_image_filesystem', image_id=image.id) }}"
                                    method="post"
                                    style="display:inline;"
                                >

                                    <button
                                        type="submit"
                                        class="delete-btn"
                                        onclick="return confirm('Удалить изображение?')"
                                    >
                                        УДАЛИТЬ
                                    </button>

                                </form>

                            </div>

                        </div>

                    {% endfor %}

                </div>

            </div>

        {% else %}

            <p style="text-align:center;">
                Пока нет загруженных изображений
            </p>

        {% endif %}

    </section>

</main>

<!-- JS -->
<script src="{{ url_for('static', filename='js/images.js') }}"></script>

</body>
</html>
